name: Build and Archive iOS App

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      version:
        description: "App Marketing Version (e.g. 1.0.3)"
        required: false
        default: "1.0.3"

# Tự động hủy build cũ nếu có push mới để tránh nghẽn hàng đợi runner macOS
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_ios:
    # Sử dụng macos-latest để cung cấp Xcode 26+ và iOS 26 SDK theo yêu cầu bắt buộc của Apple App Store Connect
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select and Verify Xcode
        run: |
          echo "Danh sách các phiên bản Xcode có sẵn trên runner:"
          ls -d /Applications/Xcode*.app || true

          DEFAULT_VER=$(xcodebuild -version 2>/dev/null | head -n 1 || true)
          echo "Xcode mặc định hiện tại: $DEFAULT_VER"

          # Tìm phiên bản Xcode cao nhất (bắt buộc Xcode >= 26 theo chính sách Apple App Store Connect)
          BEST_XCODE=""
          MAX_VER=0

          for xc in /Applications/Xcode*.app; do
            if [ -d "$xc" ]; then
              v=$("$xc/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | head -n 1 | sed -E 's/Xcode ([0-9]+).*/\1/' || echo "0")
              echo "Phát hiện $xc: Xcode $v"
              if [ "$v" -gt "$MAX_VER" ] 2>/dev/null; then
                MAX_VER=$v
                BEST_XCODE="$xc"
              fi
            fi
          done

          if [ -n "$BEST_XCODE" ]; then
            echo "Kích hoạt Xcode phiên bản cao nhất: $BEST_XCODE (Xcode $MAX_VER)"
            sudo xcode-select -s "$BEST_XCODE/Contents/Developer"
          fi

          echo "Phiên bản Xcode đang kích hoạt:"
          xcodebuild -version
          sw_vers

          ACTIVE_MAJOR=$(xcodebuild -version 2>/dev/null | head -n 1 | sed -E 's/Xcode ([0-9]+).*/\1/' || echo "0")
          if [ "$ACTIVE_MAJOR" -lt 26 ] 2>/dev/null; then
            echo "::warning::Xcode hiện tại là $ACTIVE_MAJOR. Apple yêu cầu Xcode 26+ cho TestFlight."
          fi

          # Khởi chạy các thành phần ban đầu của Xcode và tải iOS platform/simulator runtime nếu cần
          sudo xcodebuild -runFirstLaunch || true
          echo "Kiểm tra và nạp iOS Platform components..."
          sudo xcodebuild -downloadPlatform iOS || true
          xcrun simctl list runtimes || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install Dependencies
        run: |
          node -v
          # Sử dụng nghiêm ngặt npm ci từ package-lock.json để bảo đảm 100% nhất quán phiên bản
          npm ci

      - name: Check Mobile Assets
        run: |
          if [ -d "assets" ]; then
            echo "Generating assets from assets/ directory..."
            npx @capacitor/assets generate || true
          else
            echo "No root assets/ directory found. Using existing xcassets in ios/App."
          fi

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor iOS
        run: |
          test -d ios/App || {
            echo "ERROR: ios/App is missing."
            echo "Commit the ios/ directory to GitHub. This workflow intentionally does NOT run 'rm -rf ios' or 'cap add ios'."
            exit 1
          }

          npx cap sync ios

          cd ios/App
          if [ -f "Podfile.lock" ]; then
            echo "Đã tìm thấy Podfile.lock, tiến hành cài đặt cố định theo lockfile..."
            pod install || pod install --repo-update
          else
            echo "Chưa có Podfile.lock trên repo, tiến hành cài đặt và sinh Podfile.lock..."
            pod install || pod install --repo-update
          fi

      - name: Verify iOS App Icon
        run: |
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"

          if [ ! -d "$ICON_DIR" ]; then
            echo "ERROR: $ICON_DIR not found."
            exit 1
          fi

          echo "AppIcon.appiconset contents:"
          ls -lah "$ICON_DIR"

          ICON_COUNT=$(find "$ICON_DIR" -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \) | wc -l | tr -d ' ')

          if [ "$ICON_COUNT" -eq 0 ]; then
            echo "ERROR: No icon image files found."
            exit 1
          fi

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "::error::Thiếu secret IOS_CERTIFICATE_P12_BASE64 trong GitHub repository secrets!"
            exit 1
          fi

          if [ -z "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "::error::Thiếu secret IOS_PROVISION_PROFILE_BASE64 trong GitHub repository secrets!"
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          # Sử dụng mật khẩu tạm cho keychain runner (không phụ thuộc vào secret KEYCHAIN_PASSWORD)
          KEYCHAIN_PWD="${KEYCHAIN_PASSWORD:-RunnerSigningKeychainPass123!}"

          # Giải mã base64 an toàn bằng Python để loại bỏ triệt để lỗi xuống dòng / khoảng trắng
          python3 -c "
import os, base64

for env_var, path in [('BUILD_CERTIFICATE_BASE64', '$CERTIFICATE_PATH'), ('BUILD_PROVISION_PROFILE_BASE64', '$PP_PATH')]:
    raw = os.environ.get(env_var, '').strip()
    clean = ''.join(raw.split())
    with open(path, 'wb') as f:
        f.write(base64.b64decode(clean))
"

          # Chuẩn hóa mật khẩu P12 (loại bỏ khoảng trắng / ký tự xuống dòng thừa)
          CLEAN_P12_PWD=$(printf '%s' "$P12_PASSWORD" | tr -d '\r\n')

          # Khởi tạo Keychain tạm
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Import chứng chỉ vào keychain
          echo "Đang import chứng chỉ .p12 vào Keychain..."
          IMPORTED=0

          # Thử import trực tiếp trước
          if security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$CLEAN_P12_PWD" -T /usr/bin/codesign -T /usr/bin/security -A 2>&1; then
            IMPORTED=1
            echo "Import chứng chỉ trực tiếp thành công."
          else
            echo "Lần import đầu tiên chưa thành công (do macOS Keychain không đọc được mã hóa AES-256 mới của OpenSSL 3)."
            echo "Đang chuyển đổi định dạng container .p12 sang PBE-SHA1-3DES tương thích chuẩn macOS Keychain..."

            # Trích xuất pem bundle từ .p12 gốc bằng OpenSSL (hỗ trợ cả file legacy hoặc modern)
            openssl pkcs12 -in "$CERTIFICATE_PATH" -nodes -legacy -passin "pass:$CLEAN_P12_PWD" -out "$RUNNER_TEMP/cert_bundle.pem" 2>/dev/null || \
            openssl pkcs12 -in "$CERTIFICATE_PATH" -nodes -passin "pass:$CLEAN_P12_PWD" -out "$RUNNER_TEMP/cert_bundle.pem" 2>/dev/null || true

            if [ -s "$RUNNER_TEMP/cert_bundle.pem" ]; then
              # Xuất lại container .p12 với cipher PBE-SHA1-3DES và macalg sha1 mà macOS Keychain yêu cầu
              openssl pkcs12 -export \
                -in "$RUNNER_TEMP/cert_bundle.pem" \
                -passout "pass:$CLEAN_P12_PWD" \
                -certpbe PBE-SHA1-3DES \
                -keypbe PBE-SHA1-3DES \
                -macalg sha1 \
                -out "$RUNNER_TEMP/cert_clean.p12" 2>/dev/null || \
              openssl pkcs12 -export -legacy \
                -in "$RUNNER_TEMP/cert_bundle.pem" \
                -passout "pass:$CLEAN_P12_PWD" \
                -certpbe PBE-SHA1-3DES \
                -keypbe PBE-SHA1-3DES \
                -macalg sha1 \
                -out "$RUNNER_TEMP/cert_clean.p12" 2>/dev/null || true

              if [ -s "$RUNNER_TEMP/cert_clean.p12" ]; then
                if security import "$RUNNER_TEMP/cert_clean.p12" -k "$KEYCHAIN_PATH" -P "$CLEAN_P12_PWD" -T /usr/bin/codesign -T /usr/bin/security -A; then
                  IMPORTED=1
                  echo "Import chứng chỉ sau khi chuẩn hóa mã hóa PBE-SHA1-3DES thành công!"
                fi
              fi
              rm -f "$RUNNER_TEMP/cert_bundle.pem" "$RUNNER_TEMP/cert_clean.p12"
            fi
          fi

          if [ "$IMPORTED" -ne 1 ]; then
            echo "::error::Không thể import chứng chỉ vào Keychain. Vui lòng kiểm tra lại secret IOS_CERTIFICATE_PASSWORD và IOS_CERTIFICATE_P12_BASE64."
            exit 1
          fi

          # Phân quyền cho codesign truy cập private key mà không hỏi popup UI
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PWD" \
            "$KEYCHAIN_PATH" || true

          # Trích xuất thông tin Provisioning Profile
          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" "$RUNNER_TEMP/profile.plist")
          BUNDLE_ID_FULL=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist")
          BUNDLE_ID=${BUNDLE_ID_FULL#*.}

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PWD=$KEYCHAIN_PWD" >> "$GITHUB_ENV"

          echo "----------------------------------------"
          echo "Provisioning profile: $PROFILE_NAME"
          echo "Team ID: $TEAM_ID"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Profile UUID: $PROFILE_UUID"
          echo "Keychain Path: $KEYCHAIN_PATH"
          echo "----------------------------------------"

          # QUAN TRỌNG: Xcode tìm profile theo tên <UUID>.mobileprovision trong thư mục này
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/build_pp.mobileprovision"

      - name: Build and Archive iOS App
        working-directory: ios/App
        env:
          DEVELOPMENT_TEAM: ${{ env.TEAM_ID }}
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
          PROFILE_NAME: ${{ env.PROFILE_NAME }}
          PROFILE_UUID: ${{ env.PROFILE_UUID }}
        run: |
          set -e

          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${DEVELOPMENT_TEAM}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
          </dict>
          </plist>
          EOF

          BUILD_NUM=$(date "+%Y%m%d%H%M")

          # Xác định version: ưu tiên input workflow -> package.json -> fallback 1.0.3
          APP_VERSION="${{ inputs.version }}"
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION=$(node -p "require('../../package.json').version" 2>/dev/null || echo "1.0.3")
          fi
          if [ "$APP_VERSION" = "0.0.0" ] || [ -z "$APP_VERSION" ]; then
            APP_VERSION="1.0.3"
          fi

          echo "Setting Marketing Version to: $APP_VERSION (Build: $BUILD_NUM)"
          agvtool new-version -all "$BUILD_NUM" || true
          agvtool new-marketing-version "$APP_VERSION" || true

          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUM" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $APP_VERSION" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" App/Info.plist || true

          # Đảm bảo Keychain tạm mở khóa và nằm trong search list
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH" 2>/dev/null || true
          security default-keychain -s "$KEYCHAIN_PATH" 2>/dev/null || true
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user 2>/dev/null | tr -d '"') 2>/dev/null || true

          echo "Kiểm tra Signing Identities trong Keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true

          # Cấu hình Code Signing CHỈ cho App target trong project.pbxproj
          echo "Áp dụng cấu hình Code Signing vào App.xcodeproj/project.pbxproj..."
          python3 configure-signing.py

          if [ -f "App.xcworkspace/contents.xcworkspacedata" ]; then
            echo "Resolving Swift Package dependencies..."
            xcodebuild \
              -resolvePackageDependencies \
              -workspace App.xcworkspace \
              -scheme App || true

            echo "Archiving workspace..."
            set +e
            xcodebuild \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath App.xcarchive \
              clean archive \
              -skipPackagePluginValidation \
              ENABLE_USER_SCRIPT_SANDBOXING=NO \
              MARKETING_VERSION="${APP_VERSION}" \
              CURRENT_PROJECT_VERSION="${BUILD_NUM}" \
              2>&1 | tee xcodebuild_archive.log
            ARCHIVE_STATUS=${PIPESTATUS[0]}
            set -e

            if [ $ARCHIVE_STATUS -ne 0 ]; then
              echo "::error::xcodebuild archive thất bại với mã lỗi $ARCHIVE_STATUS!"
              echo "=== CÁC LỖI BIÊN DỊCH SWIFT / XCODE CỤ THỂ ==="
              grep -E ": error: |fatal error:" xcodebuild_archive.log -B 2 -A 4 || true
              echo "=== CÁC LỖI THẤT BẠI TỔNG QUAN ==="
              grep -E "\(failures\)|failed with a nonzero exit code" xcodebuild_archive.log -B 2 -A 4 || true
              echo "=== 300 DÒNG CUỐI CỦA XCODEBUILD LOG ==="
              tail -n 300 xcodebuild_archive.log
              exit $ARCHIVE_STATUS
            fi
          else
            echo "Archiving project..."
            set +e
            xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath App.xcarchive \
              clean archive \
              -skipPackagePluginValidation \
              ENABLE_USER_SCRIPT_SANDBOXING=NO \
              MARKETING_VERSION="${APP_VERSION}" \
              CURRENT_PROJECT_VERSION="${BUILD_NUM}" \
              2>&1 | tee xcodebuild_archive.log
            ARCHIVE_STATUS=${PIPESTATUS[0]}
            set -e

            if [ $ARCHIVE_STATUS -ne 0 ]; then
              echo "::error::xcodebuild archive thất bại với mã lỗi $ARCHIVE_STATUS!"
              echo "=== 150 DÒNG LỖI CUỐI TỪ XCODEBUILD LOG ==="
              tail -n 150 xcodebuild_archive.log
              exit $ARCHIVE_STATUS
            fi
          fi

          echo "Exporting IPA..."
          rm -rf output

          set +e
          xcodebuild \
            -exportArchive \
            -archivePath App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath output \
            2>&1 | tee xcodebuild_export.log
          EXPORT_STATUS=${PIPESTATUS[0]}
          set -e

          if [ $EXPORT_STATUS -ne 0 ]; then
            echo "::error::xcodebuild export thất bại với mã lỗi $EXPORT_STATUS!"
            tail -n 80 xcodebuild_export.log
            exit $EXPORT_STATUS
          fi

          ls -lah output

      - name: Upload IPA and Lockfile artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-release
          path: |
            ios/App/output/*.ipa
            ios/App/Podfile.lock
          if-no-files-found: warn

      - name: Upload app to App Store Connect / TestFlight
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -e

          if [ -z "$API_KEY_ID" ] || [ -z "$API_ISSUER_ID" ] || [ -z "$API_PRIVATE_KEY" ]; then
            echo "::error::Thiếu thông tin secrets: APPSTORE_API_KEY_ID, APPSTORE_ISSUER_ID, hoặc APPSTORE_API_PRIVATE_KEY trong GitHub repository Secrets."
            exit 1
          fi

          mkdir -p "$HOME/.appstoreconnect/private_keys" "$HOME/.private_keys" "$HOME/.private_key"

          # Hỗ trợ cả private key raw hoặc base64
          if echo "$API_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$API_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          else
            echo "$API_PRIVATE_KEY" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8" 2>/dev/null || printf '%s\n' "$API_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          fi

          cp "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8" "$HOME/.private_keys/"
          cp "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8" "$HOME/.private_key/"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8" "$HOME/.private_keys/AuthKey_${API_KEY_ID}.p8" "$HOME/.private_key/AuthKey_${API_KEY_ID}.p8"

          IPA_PATH=$(find ios/App/output -name "*.ipa" -print -quit)

          if [ -z "$IPA_PATH" ]; then
            echo "::error::Không tìm thấy file .ipa trong thư mục ios/App/output."
            exit 1
          fi

          echo "Bắt đầu tải lên TestFlight: $IPA_PATH"

          xcrun altool \
            --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID" \
            --show-progress
